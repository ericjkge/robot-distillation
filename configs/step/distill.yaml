# @package _global_
# Step 3, on PEAR's training (pear/configs/training.yaml): on-policy distillation from the SFT checkpoint. The student
# runs LIBERO episodes, the teacher prefills them and scores every student token; the per-token reward is the negative
# reverse KL (k1 estimator, policy-gradient update), with no task reward (verl's docs/algo/opd.md).

# a model file's chat template for the policy (configs/models): the students use the teacher's, which sets the
# reasoning effort in the system prompt
chat_template_file: null

algorithm:
  filter_groups:
    enable: false  # DAPO's filter drops groups without reward variance: with no task reward it would drop them all
  rollout_correction:
    score_centering: false  # an RL variance reduction on task rewards, not part of distillation

actor_rollout_ref:
  actor:
    use_kl_loss: false  # the teacher is the only target
    policy_loss:
      rollout_correction:
        score_centering: false
  rollout:
    n: 1  # no group baseline is needed: the advantage is per token

distillation:
  enabled: true
  nnodes: ???  # the teacher's own GPU machines
  n_gpus_per_node: ???
  teacher_models:
    teacher_model:
      model_path: ???
      # served by PEAR's vLLM server, as the student is: its config class, with the keys that server reads
      inference:
        _target_: pear.rollout.config.PearRolloutConfig
        tensor_model_parallel_size: ???
        # the family's, as the teacher is a Qwen3.5 as well: its fp32 weights, and vLLM's settings for them (the vision
        # tower's attention in SDPA, which takes fp32)
        dtype: ${actor_rollout_ref.rollout.dtype}
        fp32_modules: ${actor_rollout_ref.rollout.fp32_modules}
        engine_kwargs: ${actor_rollout_ref.rollout.engine_kwargs}
        custom:
          lmcache:
            enable: false  # the teacher only prefills, so it has no KV tier to offload
  distillation_loss:
    loss_mode: k1
    use_policy_gradient: true
    policy_loss_mode: vanilla
    use_task_rewards: false

trainer:
  test_freq: 10  # evaluate after every 10th update, as Algorithm 1 does at (k+1) mod 10 = 0
  val_before_train: false
  v1:
    sampler:
      max_off_policy_threshold: 1  # Algorithm 1: each update trains on episodes of the current policy only (PEAR: 5)
