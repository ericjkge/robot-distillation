# @package _global_
# Step 2, on verl's SFT trainer (verl/trainer/config/sft_trainer_engine.yaml): SFT of a student on the teacher's
# successful episodes, the loss on every token the teacher generated, in the exact tensors the rollout produced
# (opd.sft_data), so training sees the inference context format.

data:
  train_files: ???  # the directory opd.collect wrote
  val_files: null
  train_max_samples: -1  # the set opd.select_episodes drew: up to 25 episodes per task
  train_batch_size: 32
  pad_mode: no_padding
  max_length: 163840  # PEAR's LIBERO training budget: 4096 prompt + 160000 response tokens
  truncation: error
  custom_cls:
    path: pkg://opd.sft_data
    name: EpisodeDataset

model:
  path: ???
  trust_remote_code: true

# FSDP2, as PEAR trains its actor
engine:
  strategy: fsdp2

# the checkpoint also as a Hugging Face model (<ckpt>/global_step_<n>/huggingface), which distillation and evaluation
# load
checkpoint:
  save_contents: [model, optimizer, extra, hf_model]

# verl's optimizer default (a constant 1e-3) is for training from scratch
optim:
  lr: 1e-5
  lr_scheduler_type: cosine
  lr_warmup_steps_ratio: 0.05

trainer:
  total_epochs: 3
  logger: ["console", "file"]
